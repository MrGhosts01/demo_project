<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>尾声 · 所以这一次，我到底是谁？</title>
<meta name="theme-color" content="#0c0a09" />
<!--
  ═══════════════════════════════════════════════════════════════
  「尾声 · 千载回响」课程结尾互动 demo
  ─────────────────────────────────────────
  文件结构：
    index.html  —— 页面结构（本文件）
    style.css   —— 全部样式与动画
    script.js   —— SCENE JSON 数据 + 渲染与交互逻辑
  字体：Noto Serif SC（OFL 开源协议）按需分包 woff2，
        经 npmmirror CDN 加载，保证 PC / Android / iOS 渲染一致。
  设计说明（面试用）：
  · 整页由 SCENE JSON 数据驱动（见 script.js），
    模拟「JSON 剧本引擎的互动节点组件」：
    换文案 / 换顺序 / 增删君主，只改 data，不动渲染逻辑。
  · 五位君主立绘为 AI 生成切图（assets/rulers/*.png，真透明背景，
    经 tools/process-rulers.js 清雾、裁剪、统一画布 640×896 与人物高度）。
    更换立绘：替换同名 PNG 或改 script.js 中 img 字段即可，
    布局与交互不受影响；图挂了自动回退到剪影占位。
  · 交互：悬浮（或触屏点按）君主 → 该立绘放大、其余压暗 →
    底部面板展示其第一人称功绩「我做的是……」，可开启语音朗读；
    每位君主选中时鸣一声编钟，音高各不相同（D 羽调五声音阶）。
  · 背景音与编钟音效由 tools/ 脚本合成；独白语音为本地音频文件，
    Android 微信端直接播放，桌面端仍使用系统语音合成；
    背景音在首次用户手势后淡入（移动端自动播放合规 + iOS GainNode）。
  · 五位全部听过之后，解锁结尾字幕（进度点会逐个点亮）。
  ═══════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://registry.npmmirror.com" />
<link rel="stylesheet" href="https://registry.npmmirror.com/@fontsource/noto-serif-sc/5.3.1/files/400.css" />
<link rel="stylesheet" href="https://registry.npmmirror.com/@fontsource/noto-serif-sc/5.3.1/files/600.css" />
<link rel="stylesheet" href="https://registry.npmmirror.com/@fontsource/noto-serif-sc/5.3.1/files/700.css" />
<link rel="stylesheet" href="style.css" />
<script src="script.js" defer></script>
</head>
<body>

  <div class="atmosphere"></div>
  <div class="grain"></div>

  <!-- 顶栏：场景标识（对齐产品「尾声 · 千载回响」导航）+ 功能按钮 -->
  <header class="topbar">
    <span class="eyebrow"><b>尾声</b> · 千载回响</span>
    <div class="topbar-actions">
      <button class="icon-btn" id="bgmBtn" title="开启/关闭背景音乐">
        <span id="bgmIcon">🎵</span><span class="btn-label" id="bgmText">音乐 开</span>
      </button>
      <button class="icon-btn on" id="voiceBtn" title="开启/关闭语音朗读">
        <span id="voiceIcon">🔊</span><span class="btn-label" id="voiceText">语音 开</span>
      </button>
      <button class="icon-btn" id="replayBtn" title="重看本场景">↺ 重看</button>
    </div>
  </header>

  <!-- 场景一：内心 OS（接动画之后） -->
  <section class="os-stage" id="osStage">
    <span class="os-tag">内 心 O S</span>
    <div class="os-line"><span id="osText"></span><span class="caret"></span></div>
    <span class="os-hint">请 戴 上 耳 机 · 点 击 任 意 处 开 启 背 景 音</span>
  </section>

  <!-- 场景二：五君立绘 + 悬浮互动 -->
  <main class="main-stage" id="mainStage">
    <div class="stage-title">这一次，你听到的声音，来自<span class="em">五个人</span></div>

    <div class="rulers" id="rulers"><!-- 君主卡片由 JS 依据 SCENE JSON 渲染 --></div>

    <div class="deed-zone">
      <div class="dots" id="dots"></div>
      <div class="deed-box">
        <span class="deed-eyebrow" id="deedEyebrow">我 做 的 是 ——</span>
        <p class="deed-text" id="deedText"><span class="deed-default">把光标放到他们身上，听听每个人做了什么</span></p>
      </div>
    </div>
  </main>

  <!-- 终幕：五人全听过后的字幕 -->
  <section class="ending" id="ending">
    <div class="divider"></div>
    <p class="big-line">所以这一次，你不是一个人<br />你是<span class="em">他们五个</span></p>
    <p class="sub-line">五个名字 · 一条血脉 · 五百年蓄力<br />你这一课所见的一切，是秦国五世之功</p>
    <div class="divider"></div>
    <button class="close-btn" id="closeEnding">回 到 他 们</button>
  </section>

</body>
</html>
